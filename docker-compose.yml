services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-despesas}
      POSTGRES_USER: ${POSTGRES_USER:-despesas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-despesas_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-despesas} -d ${POSTGRES_DB:-despesas}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      POSTGRES_DB: ${POSTGRES_DB:-despesas}
      POSTGRES_USER: ${POSTGRES_USER:-despesas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-despesas_dev}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_DB_ENGINE: postgresql
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
